  <script>
    /* F-004b：笔记本入口（第 1 周目隐藏 / 第 2+ 周目图标按钮 + 弹层翻页）。
       数据来源 window.LoopState.getNotebookEntries()；
       骨架来自 window.NotebookConfig.LOOP_NOTEBOOK_TONE。
       正文渲染走 renderNotebookBodyHtml 受控白名单（仅 <del> / <br>）。 */
    (function () {
      var panel    = document.getElementById('notebook-panel');
      var overlay  = document.getElementById('notebook-overlay');
      var modal    = document.getElementById('notebook-modal');
      var openBtn  = document.getElementById('notebook-open-btn');
      var closeBtn = document.getElementById('notebook-close-btn');
      var prevBtn  = document.getElementById('notebook-prev');
      var nextBtn  = document.getElementById('notebook-next');
      var headerEl = document.getElementById('notebook-page-header');
      var bodyEl   = document.getElementById('notebook-page-body');
      var fbEl     = document.getElementById('notebook-page-fallback');
      var retryRow = document.getElementById('notebook-retry-row');
      var retryBtn = document.getElementById('notebook-retry-btn');
      var retryStatusEl = document.getElementById('notebook-retry-status');
      var indEl    = document.getElementById('notebook-page-indicator');

      if (!panel || !overlay || !modal || !openBtn) return;

      /* 须在 LoopState.start() / tryAutoImport 之后再次调用（见 loop.js finishLoopSelect）。 */
      function resetNotebookIconVisualState() {
        if (!openBtn) return;
        cleanAnimClass(openBtn, 'nb-closing');
        cleanAnimClass(openBtn, 'nb-opening-back');
        openBtn.style.opacity = '';
        openBtn.style.transform = '';
      }

      function syncNotebookPanelVisibility() {
        var loopIdx = getCurrentLoopIndexSafe();
        if (loopIdx <= 1) {
          panel.hidden = true;
          panel.style.display = 'none';
        } else {
          panel.hidden = false;
          panel.style.display = '';
          if (!isOpen) resetNotebookIconVisualState();
        }
      }

      var currentPage = 0;
      var isOpen = false;
      var notebookRetryInFlight = false;

      function getEntries() {
        try {
          if (window.LoopState && typeof window.LoopState.getNotebookEntries === 'function') {
            var arr = window.LoopState.getNotebookEntries();
            if (Array.isArray(arr)) return arr;
          }
        } catch (_) {}
        return [];
      }

      /* 受控 HTML 渲染：先全转义，再放回 <del> / <br> 白名单。 */
      function renderNotebookBodyHtml(body) {
        if (!body || typeof body !== 'string') return '';
        var esc = body
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        esc = esc.replace(/&lt;del&gt;/g, '<del>')
                 .replace(/&lt;\/del&gt;/g, '</del>')
                 .replace(/&lt;br\s*\/?&gt;/g, '<br>');
        return esc;
      }

      function getHeaderLabelFor(entry, fallbackIndex) {
        if (entry && typeof entry.headerLabel === 'string' && entry.headerLabel) {
          return entry.headerLabel;
        }
        try {
          if (window.NotebookConfig && typeof window.NotebookConfig.getTonePresetFor === 'function') {
            var tone = window.NotebookConfig.getTonePresetFor(fallbackIndex);
            if (tone && tone.headerLabel) return tone.headerLabel;
          }
        } catch (_) {}
        return '第 ' + fallbackIndex + ' 次轮回';
      }

      function setNotebookRetryStatus(text, isError) {
        if (!retryStatusEl) return;
        retryStatusEl.textContent = text || '';
        retryStatusEl.classList.toggle('is-error', !!isError);
      }

      function getCurrentLoopIndexSafe() {
        try {
          if (window.LoopState && typeof window.LoopState.getLoopIndex === 'function') {
            return window.LoopState.getLoopIndex();
          }
        } catch (_) {}
        return 1;
      }

      function isNotebookRetryable(entry, pageIndex, total) {
        if (!entry || total <= 0) return false;
        /* 仅笔记本最后一页可重试 */
        if (pageIndex !== total - 1) return false;
        var body = (typeof entry.body === 'string') ? entry.body : '';
        if (body.trim().length > 0) return false;
        var source = (typeof entry.source === 'string') ? entry.source : '';
        var hasError = (typeof entry.error === 'string' && entry.error.trim().length > 0);
        return source === 'fallback' || hasError;
      }

      function updateNotebookRetryUi(entry, pageIndex, total) {
        if (!retryRow || !retryBtn) return;
        var canRetry = isNotebookRetryable(entry, pageIndex, total);
        retryRow.hidden = !canRetry;
        retryBtn.disabled = notebookRetryInFlight;
        retryBtn.setAttribute('aria-disabled', notebookRetryInFlight ? 'true' : 'false');
        if (!canRetry) {
          setNotebookRetryStatus('', false);
          return;
        }
        if (!notebookRetryInFlight && (!retryStatusEl || !retryStatusEl.textContent)) {
          setNotebookRetryStatus('日记生成失败后可点击重新回忆。', false);
        }
      }

      function renderNotebookPage(pageIndex) {
        var entries = getEntries();
        var total = entries.length;
        if (total === 0) {
          headerEl.textContent = '还没有任何记录';
          bodyEl.innerHTML = '';
          fbEl.hidden = false;
          fbEl.textContent = '这一轮的记忆模糊了……';
          indEl.textContent = '0 / 0';
          prevBtn.disabled = true;
          nextBtn.disabled = true;
          updateNotebookRetryUi(null, 0, 0);
          return;
        }

        if (pageIndex < 0) pageIndex = 0;
        if (pageIndex >= total) pageIndex = total - 1;
        currentPage = pageIndex;

        var entry = entries[pageIndex] || {};
        var fallbackIdx = (typeof entry.loopIndex === 'number') ? entry.loopIndex : (pageIndex + 1);
        headerEl.textContent = getHeaderLabelFor(entry, fallbackIdx);

        var body = (typeof entry.body === 'string') ? entry.body : '';
        if (body.trim().length === 0) {
          bodyEl.innerHTML = '';
          fbEl.hidden = false;
          fbEl.textContent = '这一轮的记忆模糊了……';
        } else {
          bodyEl.innerHTML = renderNotebookBodyHtml(body);
          fbEl.hidden = true;
        }

        indEl.textContent = (pageIndex + 1) + ' / ' + total;
        prevBtn.disabled = (pageIndex <= 0);
        nextBtn.disabled = (pageIndex >= total - 1);
        updateNotebookRetryUi(entry, pageIndex, total);
      }

      function goNotebookPage(delta) {
        var entries = getEntries();
        if (entries.length === 0) return;
        renderNotebookPage(currentPage + delta);
      }

      function resolvePageIndex(pageOpt) {
        var entries = getEntries();
        if (entries.length === 0) return 0;
        if (pageOpt === 'first' || pageOpt === 0) return 0;
        if (pageOpt === 'last') return entries.length - 1;
        var n = Number(pageOpt);
        if (Number.isFinite(n)) {
          if (n < 0) return 0;
          if (n >= entries.length) return entries.length - 1;
          return Math.floor(n);
        }
        return entries.length - 1;
      }

      /* #3 动画辅助：清理动画 class，避免重复触发 */
      function cleanAnimClass(el, cls) {
        if (!el) return;
        el.classList.remove(cls);
        void el.offsetWidth; // reflow trigger
      }

      function openNotebook(pageOpt) {
        if (isOpen) {
          renderNotebookPage(resolvePageIndex(pageOpt));
          return;
        }
        isOpen = true;

        /* #3 open 动画：图标缩小 → overlay 放大出现 */
        cleanAnimClass(openBtn, 'nb-opening-back');
        openBtn.classList.add('nb-closing');
        overlay.hidden = false;
        cleanAnimClass(overlay, 'nb-leave');
        overlay.classList.add('nb-enter');
        overlay.addEventListener('animationend', function onEnter() {
          overlay.removeEventListener('animationend', onEnter);
          overlay.classList.remove('nb-enter');
        });

        renderNotebookPage(resolvePageIndex(pageOpt));

        /* #4 第二周目首次开笔记本：笔写字动画 */
        var li2 = getCurrentLoopIndexSafe();
        if (li2 === 2) {
          var firstOpenKey = 'npc_notebook_loop2_opened';
          var hasOpened = false;
          try { hasOpened = localStorage.getItem(firstOpenKey) === '1'; } catch(_) {}
          if (!hasOpened) {
            try { localStorage.setItem(firstOpenKey, '1'); } catch(_) {}
            setTimeout(function() { runPenWriteAnimation(); }, 400);
          }
        }

        setTimeout(function () {
          if (closeBtn && typeof closeBtn.focus === 'function') closeBtn.focus();
        }, 0);
      }

      function finishNotebookCloseVisual() {
        if (!overlay) return;
        overlay.classList.remove('nb-leave');
        overlay.hidden = true;
        resetNotebookIconVisualState();
      }

      function closeNotebook() {
        if (!isOpen) return;
        isOpen = false;

        /* #3 close 动画：overlay 缩小消失 → 图标放大回来 */
        cleanAnimClass(overlay, 'nb-enter');
        overlay.classList.add('nb-leave');

        var closeFinished = false;
        function completeClose() {
          if (closeFinished) return;
          closeFinished = true;
          finishNotebookCloseVisual();
        }

        function onLeave(e) {
          if (e && e.target !== overlay) return;
          overlay.removeEventListener('animationend', onLeave);
          completeClose();
        }
        overlay.addEventListener('animationend', onLeave);
        /* animationend 偶发不触发时仍恢复右下角图标 */
        setTimeout(completeClose, 450);

        if (openBtn && typeof openBtn.focus === 'function') openBtn.focus();
      }

      /* #4 笔写字动画实现 */
      function runPenWriteAnimation() {
        var pageBodyEl = document.getElementById('notebook-page-body');
        if (!pageBodyEl) return;
        var originalText = pageBodyEl.innerText || pageBodyEl.textContent || '';
        if (!originalText.trim()) return;

        /* 创建笔光标 */
        var pen = document.createElement('span');
        pen.className = 'nb-pen-cursor';
        pen.textContent = '✒️';
        pageBodyEl.style.position = 'relative';
        pageBodyEl.appendChild(pen);

        /* 隐藏正文，准备打字机显示 */
        var fullHtml = pageBodyEl.innerHTML;
        /* 去掉笔元素再取文字 */
        pageBodyEl.removeChild(pen);
        var textContent = pageBodyEl.innerText || pageBodyEl.textContent || '';
        pageBodyEl.innerHTML = '';
        pageBodyEl.style.position = 'relative';
        pageBodyEl.appendChild(pen);

        var wrapper = document.createElement('span');
        wrapper.className = 'nb-typewriter-wrap';
        pageBodyEl.appendChild(wrapper);

        /* 笔移入动画 */
        pen.classList.add('nb-pen-animating');

        /* 打字机效果：每 40ms 显示一个字 */
        var chars = Array.from(textContent);
        var idx = 0;
        var PEN_DELAY_MS = 800;  // 笔移动时间
        var CHAR_INTERVAL_MS = 40;

        setTimeout(function startTyping() {
          var timer = setInterval(function () {
            if (idx < chars.length) {
              wrapper.textContent += chars[idx];
              idx++;
            } else {
              clearInterval(timer);
              /* 笔淡出 */
              pen.style.opacity = '0';
              setTimeout(function() {
                if (pen.parentNode) pen.parentNode.removeChild(pen);
              }, 400);
            }
          }, CHAR_INTERVAL_MS);
        }, PEN_DELAY_MS);
      }

      function handleNotebookKeydown(e) {
        if (!isOpen) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === 'Escape' || e.key === 'Esc') {
          e.preventDefault();
          e.stopPropagation();
          closeNotebook();
          return;
        }
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          e.stopPropagation();
          goNotebookPage(-1);
          return;
        }
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          e.stopPropagation();
          goNotebookPage(1);
          return;
        }
      }

      async function handleNotebookRetryClick() {
        if (notebookRetryInFlight) return;
        var entries = getEntries();
        if (!entries.length) return;
        var target = entries[currentPage];
        if (!isNotebookRetryable(target, currentPage, entries.length)) return;
        if (!window.EndingState ||
            typeof window.EndingState.retryCurrentLoopNotebookGeneration !== 'function') {
          setNotebookRetryStatus('当前阶段无法重新回忆，请在终局后重试。', true);
          return;
        }

        notebookRetryInFlight = true;
        retryBtn.disabled = true;
        setNotebookRetryStatus('正在重新回忆，请稍候……', false);

        try {
          var result = await window.EndingState.retryCurrentLoopNotebookGeneration();
          if (result && result.ok) {
            setNotebookRetryStatus('已重新回忆成功。', false);
          } else {
            setNotebookRetryStatus('重新回忆失败，请稍后再试。', true);
          }
          renderNotebookPage(currentPage);
        } catch (_) {
          setNotebookRetryStatus('重新回忆失败，请稍后再试。', true);
        } finally {
          notebookRetryInFlight = false;
          updateNotebookRetryUi(getEntries()[currentPage], currentPage, getEntries().length);
        }
      }

      if (openBtn) {
        openBtn.addEventListener('click', function () { openNotebook('last'); });
      }
      if (closeBtn) closeBtn.addEventListener('click', closeNotebook);
      if (prevBtn) prevBtn.addEventListener('click', function () { goNotebookPage(-1); });
      if (nextBtn) nextBtn.addEventListener('click', function () { goNotebookPage(1); });
      if (retryBtn) retryBtn.addEventListener('click', function () { void handleNotebookRetryClick(); });

      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeNotebook();
      });

      document.addEventListener('keydown', handleNotebookKeydown, true);

      window.NPCNotebookUi = {
        open: function (opt) {
          var page = (opt && opt.page !== undefined) ? opt.page : 'last';
          openNotebook(page);
        },
        close: closeNotebook,
        isOpen: function () { return isOpen; },
        syncPanelVisibility: syncNotebookPanelVisibility,
      };

      syncNotebookPanelVisibility();
    })();
  </script>

  <script>
    (function () {
      var overlay = document.getElementById('intro-overlay');
      var lines   = overlay.querySelectorAll('.intro-line');
      var hint    = overlay.querySelector('.intro-hint');
      var introLoopIndexOverride = null;

      overlay.style.pointerEvents = 'none';

      var INTRO_LINES_BY_LOOP = {

        ],

        3: [
          "又回到原点",
          "我好像想起了什么",
          "不对，我是说你",
          "要不要问问那个花店在哪里？",
        ],
        4: [
          "又回来了。",
          "这一次走得没那么慢了。",
          "我终于想起来了。",
          "……所以接下来，要做什么？",
        ],
        5: [
          "又回来了。",
          "这一次，我不打算再退。",
          "你不感到痛苦吗？",
          "——为什么还要一遍遍走这条街。",
        ],
        6: [
          "又回来了。",
          "我什么都想起来了。",
          "可越想起来，越分不清——",
          "到底什么才是真相？",
        ],
      };
      var INTRO_LINES_DEFAULT = [
        "又回来了。",
        "我也数不清这是第几次了。",
        "但是没关系，他们还在那里。",
        "这次想问点什么？",
      ];

      function resolveIntroLoopIndex() {
        if (typeof introLoopIndexOverride === 'number' &&
            isFinite(introLoopIndexOverride) &&
            introLoopIndexOverride >= 1) {
          return Math.floor(introLoopIndexOverride);
        }
        try {
          if (window.LoopState && typeof window.LoopState.getLoopIndex === 'function') {
            var loopIdx = Number(window.LoopState.getLoopIndex());
            if (isFinite(loopIdx) && loopIdx >= 1) return Math.floor(loopIdx);
          }
        } catch (_) { /* ignore */ }
        return 1;
      }

      function getIntroLinesArray() {
        var loopIdx = resolveIntroLoopIndex();
        if (loopIdx === 1) return INTRO_LINES_BY_LOOP[1];
        if (INTRO_LINES_BY_LOOP[loopIdx]) return INTRO_LINES_BY_LOOP[loopIdx];
        if (loopIdx >= 7) return INTRO_LINES_DEFAULT;
        return INTRO_LINES_DEFAULT;
      }

      var TOTAL       = lines.length; // 4
      var COOLDOWN    = 3000;         // 普通行 3s 自动推进
      var FINAL_WAIT  = 10000;        // 最后一行后 10s 自动退场

      var shown       = -1;     // 当前已显示到第几行（-1 = 尚未显示任何行）
      var inFinalWait = false;  // 是否进入最终等待阶段
      var exiting     = false;  // 是否已开始退场
      var countdownGen = 0;     // 取消未完成的倒计时链

      function bumpIntroGen() {
        countdownGen++;
      }

      function applyIntroLines() {
        var introTexts = getIntroLinesArray();
        for (var li = 0; li < lines.length; li++) {
          lines[li].textContent = introTexts[li] || '';
        }
      }

      function resetIntroProgress() {
        bumpIntroGen();
        shown = -1;
        inFinalWait = false;
        exiting = false;
        hint.classList.remove('io-visible', 'io-final');
        for (var ri = 0; ri < lines.length; ri++) {
          lines[ri].classList.remove('io-visible');
        }
      }

      function startIntroSequence() {
        resetIntroProgress();
        applyIntroLines();
        overlay.style.pointerEvents = 'auto';
        setTimeout(function () {
          if (!exiting) advance();
        }, 700);
      }

      /* 由 loop.js 在周目选择遮罩关闭后调用（测试跳转 / 导入 / 续档等） */
      window.NPCOnLoopReady = function (loopIndex) {
        if (typeof loopIndex === 'number' && isFinite(loopIndex) && loopIndex >= 1) {
          introLoopIndexOverride = Math.floor(loopIndex);
        } else {
          introLoopIndexOverride = null;
        }
        startIntroSequence();
      };

      /* ── 更新提示文字 ── */
      function setHint(text, isFinal) {
        hint.textContent = text;
        hint.classList.add('io-visible');
        if (isFinal) {
          hint.classList.add('io-final');
        } else {
          hint.classList.remove('io-final');
        }
      }

      /* ── 倒计时驱动器 ── */
      function runCountdown(durationMs, onTick, onDone) {
        var token = countdownGen;
        var end = Date.now() + durationMs;
        (function tick() {
          if (exiting || token !== countdownGen) return;
          var remaining = end - Date.now();
          if (remaining <= 0) {
            if (token !== countdownGen) return;
            onDone();
            return;
          }
          onTick(Math.ceil(remaining / 1000));
          setTimeout(tick, 250);
        })();
      }

      /* ── 退场（淡出并移除节点） ── */
      function dismiss() {
        if (exiting) return;
        exiting = true;
        hint.classList.remove('io-visible');
        setTimeout(function () {
          overlay.classList.add('io-fading');
          overlay.addEventListener('transitionend', function onEnd(e) {
            if (e.target !== overlay) return;
            overlay.removeEventListener('transitionend', onEnd);
            if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
            /* #2 第二周目入口：intro 退场后自动打开笔记本 */
            try {
              var li = (window.LoopState && typeof window.LoopState.getLoopIndex === 'function')
                ? window.LoopState.getLoopIndex() : 1;
              if (li >= 2 && window.NPCNotebookUi && typeof window.NPCNotebookUi.open === 'function') {
                setTimeout(function() { window.NPCNotebookUi.open({ page: 'last' }); }, 200);
              }
            } catch (_) {}
          });
        }, 300);
      }

      /* ── 显示下一行并启动自动推进 / 最终等待 ── */
      function advance() {
        if (exiting) return;
        bumpIntroGen();
        shown++;
        if (shown >= TOTAL) return;
        lines[shown].classList.add('io-visible');

        if (shown === TOTAL - 1) {
          inFinalWait = true;
          runCountdown(
            FINAL_WAIT,
            function (s) { setHint(s + 's 后自动离开，或点击跳过', true); },
            dismiss
          );
        } else {
          runCountdown(
            COOLDOWN,
            function (s) { setHint(s + 's 后自动继续，或点击跳过', false); },
            function () {
              advance();
            }
          );
        }
      }

      /* ── 交互入口（点击 / 键盘） ── */
      function handleInteraction() {
        if (exiting) return;
        if (inFinalWait) {
          dismiss();
          return;
        }
        advance();
      }

      overlay.addEventListener('click', handleInteraction);
      document.addEventListener('keydown', function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        handleInteraction();
      });

      /* 不在此处启动：须等 loop.js 完成周目选择并调用 NPCOnLoopReady */
    })();
  </script>

  <!-- Phase 3：登录入口遮罩 + 启动控制器（R-21 反竞态：登录完成后才调 LoopState.start()） -->
  <script>
    (function () {

      /* ─────────────────────────────────────────────────────────────
         本地跳过登录模式（config.local.js 中设置 window.NPC_SKIP_LOGIN = true）
         或未配置云端（无 NPC_CLOUD_BASE_URL）时，直接启动游戏
      ───────────────────────────────────────────────────────────── */
      function shouldSkipLogin() {
        if (window.NPC_SKIP_LOGIN) return true;
        // 无云端配置时降级为本地模式
        if (!window.NPC_CLOUD_BASE_URL || typeof window.NPC_CLOUD_BASE_URL !== 'string' ||
            window.NPC_CLOUD_BASE_URL.trim().length === 0) return true;
        // 已有有效 session（localStorage 中有 user_id 和 session_token）
        if (window.UserSession && window.UserSession.isLoggedIn()) return true;
        return false;
      }

      /* ─────────────────────────────────────────────────────────────
         创建登录遮罩 DOM
      ───────────────────────────────────────────────────────────── */
      function createLoginOverlay() {
        var ov = document.createElement('div');
        ov.id = 'login-overlay';
        ov.style.cssText = [
          'position:fixed;top:0;left:0;width:100%;height:100%;',
          'background:#000;z-index:2000;display:flex;',
          'align-items:center;justify-content:center;',
          'font-family:inherit;',
        ].join('');
        return ov;
      }

      function dismissLoginOverlay(ov, onDone) {
        ov.style.transition = 'opacity 0.5s';
        ov.style.opacity = '0';
        setTimeout(function () {
          if (ov.parentNode) ov.parentNode.removeChild(ov);
          if (onDone) onDone();
        }, 500);
      }

      /* ─────────────────────────────────────────────────────────────
         入口选择（「继续上一段记忆」/ 「开启新的记忆」）
      ───────────────────────────────────────────────────────────── */
      function showLoginFlow(onComplete) {
        var ov = createLoginOverlay();
        document.body.appendChild(ov);

        var box = document.createElement('div');
        box.style.cssText = [
          'max-width:380px;width:90%;padding:40px 32px;',
          'background:#111;border:1px solid #333;border-radius:8px;',
          'color:#ddd;text-align:center;',
        ].join('');

        var title = document.createElement('p');
        title.style.cssText = 'font-size:1.2em;margin:0 0 32px;letter-spacing:0.05em;';
        title.textContent = '你站在这条街上。';

        var btnA = document.createElement('button');
        btnA.textContent = '继续上一段记忆';
        btnA.style.cssText = _btnStyle(false);

        var btnB = document.createElement('button');
        btnB.textContent = '开启新的记忆';
        btnB.style.cssText = _btnStyle(true);

        var statusEl = document.createElement('p');
        statusEl.style.cssText = 'margin:16px 0 0;font-size:0.85em;color:#888;min-height:1.4em;';

        box.appendChild(title);
        box.appendChild(btnA);
        box.appendChild(btnB);
        box.appendChild(statusEl);
        ov.appendChild(box);

        function _btnStyle(dim) {
          return [
            'display:block;width:100%;padding:12px;margin-bottom:12px;',
            'background:' + (dim ? '#1a1a1a' : '#222') + ';',
            'color:' + (dim ? '#888' : '#ccc') + ';',
            'border:1px solid #444;border-radius:4px;cursor:pointer;',
            'font-size:1em;letter-spacing:0.03em;',
          ].join('');
        }

        function showPinForm(isNew) {
          box.innerHTML = '';
          var formTitle = document.createElement('p');
          formTitle.style.cssText = 'font-size:1em;margin:0 0 20px;color:#aaa;';
          formTitle.textContent = isNew ? '起一个你记得住的名字' : '请输入昵称与密码';
          box.appendChild(formTitle);

          var nicknameInput = document.createElement('input');
          nicknameInput.type = 'text';
          nicknameInput.placeholder = '昵称（最多 20 字）';
          nicknameInput.maxLength = 20;
          nicknameInput.style.cssText = _inputStyle();
          box.appendChild(nicknameInput);

          var pinInput = document.createElement('input');
          pinInput.type = 'password';
          pinInput.placeholder = '4 位数字密码';
          pinInput.maxLength = 4;
          pinInput.inputMode = 'numeric';
          pinInput.style.cssText = _inputStyle();
          box.appendChild(pinInput);

          var confirmBtn = document.createElement('button');
          confirmBtn.textContent = isNew ? '创建记忆' : '进入';
          confirmBtn.style.cssText = _btnStyle(false);
          box.appendChild(confirmBtn);

          var err = document.createElement('p');
          err.style.cssText = 'margin:8px 0 0;font-size:0.82em;color:#c66;min-height:1.2em;';
          box.appendChild(err);

          function _inputStyle() {
            return [
              'display:block;width:100%;box-sizing:border-box;',
              'padding:10px 12px;margin-bottom:12px;',
              'background:#1a1a1a;color:#ddd;border:1px solid #444;border-radius:4px;',
              'font-size:0.95em;',
            ].join('');
          }

          async function doLogin() {
            var nickname = nicknameInput.value.trim();
            var pin = pinInput.value.trim();
            if (!nickname) { err.textContent = '请输入昵称'; return; }
            if (!/^\d{4}$/.test(pin)) { err.textContent = 'PIN 必须是 4 位数字'; return; }

            confirmBtn.disabled = true;
            err.textContent = '正在验证……';

            var result = await window.UserSession.login(nickname, pin);
            confirmBtn.disabled = false;

            if (!result || !result.ok) {
              var msg = result && result.error === 'wrong_pin' ? '密码错误，请重试。'
                : result && result.error === 'network_error' ? '无法连接服务器，请检查网络。'
                : '登录失败，请重试。';
              err.textContent = msg;
              return;
            }

            err.textContent = '';

            // 「继续上一段」：先拉云端存档，无存档/失败再静默兜底走本地日志续接
            if (!isNew) {
              err.style.color = '#888';
              err.textContent = '正在读取记忆……';
              var cloudArchive = null;
              try {
                var loadResult = await window.SaveAdapter.load();
                if (loadResult && loadResult.ok && loadResult.archive) {
                  cloudArchive = loadResult.archive;
                }
              } catch (cloudErr) {
                console.warn('[login] SaveAdapter.load failed:', cloudErr);
              }

              if (!cloudArchive) {
                // 云端无存档或读取失败 → 尝试本地日志续接
                if (window.LogRestore &&
                    typeof window.LogRestore.resolveLatestRestore === 'function') {
                  try {
                    var restoreResult = await window.LogRestore.resolveLatestRestore();
                    if (restoreResult && restoreResult.archive && restoreResult.targetLoopIndex) {
                      try {
                        if (window.AuditLog &&
                            typeof window.AuditLog.applySessionId === 'function' &&
                            restoreResult.sessionId) {
                          window.AuditLog.applySessionId(restoreResult.sessionId);
                        }
                      } catch (sessionErr) {
                        console.warn('[login] applySessionId failed:', sessionErr);
                      }
                      try {
                        sessionStorage.setItem(
                          'npc_pending_loop',
                          JSON.stringify(restoreResult.archive)
                        );
                      } catch (storageErr) {
                        console.warn('[login] sessionStorage write failed:', storageErr);
                      }
                    }
                  } catch (restoreErr) {
                    console.warn('[login] LogRestore fallback failed:', restoreErr);
                  }
                }
              }
            }

            dismissLoginOverlay(ov, onComplete);
          }

          confirmBtn.addEventListener('click', doLogin);
          pinInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') doLogin();
          });

          setTimeout(function () { nicknameInput.focus(); }, 0);
        }

        btnA.addEventListener('click', function () { showPinForm(false); });
        btnB.addEventListener('click', function () { showPinForm(true); });
      }

      /* ─────────────────────────────────────────────────────────────
         主流程入口（页面加载后执行）
      ───────────────────────────────────────────────────────────── */
      function startApp() {
        if (window.LoopState && typeof window.LoopState.start === 'function') {
          window.LoopState.start();
        }
      }

      if (shouldSkipLogin()) {
        // 本地/已登录：直接启动游戏
        startApp();
      } else {
        // 显示登录遮罩，登录完成后启动游戏
        showLoginFlow(startApp);
      }

    })();
  </script>
